# Cloudflare Worker config for the Registry Service.
#
# What FtB must fill in before `wrangler deploy` (local dev and tests need none of it):
#   account_id  — from the Cloudflare dashboard (Workers & Pages → Overview, right-hand column),
#                 or leave it out and let `wrangler login` pick the account interactively.
#   database_id — from `wrangler d1 create ftb-registry` (prints the id) or the D1 dashboard page.
# The placeholders below are deliberately not valid ids; wrangler's local mode ignores them.

name = "ftb-registry-service"
main = "src/index.ts"
# Pinned to the newest date the bundled workerd supports at the time of writing; raise it when
# wrangler/miniflare are upgraded.
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# account_id = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"

[[d1_databases]]
binding = "DB"                       # available as env.DB in the Worker
database_name = "ftb-registry"       # the name you gave `wrangler d1 create`
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Browser origins allowed to call the API (CORS), comma-separated. Local dev needs nothing: when this
# is unset only localhost / 127.0.0.1 origins are allowed. Set it to the deployed client's origin.
# [vars]
# CORS_ORIGINS = "https://app.example.com"

[observability]
enabled = true
