# Free the Brain — MCP server (Cloudflare Worker entry)
#
# account_id and REGISTRY_URL are the real ones (filled 2026-09-09). Secrets never live here:
# CI sets them from GitHub secrets (.github/workflows/deploy.yml), or set them once on the Worker's
# Settings → Variables and Secrets page.
name = "free-the-brain-mcp"
account_id = "0fb9effb6f6efb07ec8d9408fe0cb562"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The ext-apps browser bundle is inlined into the MCP App view as a string module.
# `npm run build:ui` generates src/generated/ext-apps-bundle.txt first.
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[vars]
# Origin of the Registry Service (service/) — /api/v1 is appended. Swap for api.freethebrain.app
# once the domain is bought and mapped.
REGISTRY_URL = "https://ftb-registry-service.christo-edrev.workers.dev"
# The MCP endpoint is fixed at /mcp on the Worker: it is the OAuth provider's apiRoute (src/worker.ts).

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   MCP_TOKEN                — the password the OAuth sign-in page (/authorize) asks for; unset = the
#                              page answers 503 and no token is ever issued (see README "Workers and OAuth")
#   REGISTRY_TOKEN           — bearer for the service, sent on every request; = the service's
#                              OWNER_TOKEN while it runs in owner-token mode (until Access)
#   CF_ACCESS_CLIENT_ID      — optional Cloudflare Access service token pair, if the
#   CF_ACCESS_CLIENT_SECRET    service sits behind Access (ADR-1)

# --- OAuth ----------------------------------------------------------------------
# @cloudflare/workers-oauth-provider keeps clients, grants and (hashed) tokens here.
# Namespace "ftb-oauth", created in the Cloudflare dashboard.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "0ab62935dd044f86ae173a5cf27e1862"

# --- Routing (optional) -------------------------------------------------------
# [[routes]]
# pattern = "mcp.<your-domain>"
# custom_domain = true
