<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8e9dfa">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FreeBrain">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Master — Task Registry</title>
</head>
<body>
<div class="top"><h1>Master</h1><span class="prov" id="prov"></span></div>
<p class="sum" id="sum"></p>
<div class="tabbar" id="tabbar"></div>
<div class="ctrls">
  <input type="text" id="q" placeholder="Filter this tab…">
  <button class="tbtn" id="subtoggle">Hide subtasks</button>
  <button class="tbtn" id="clearbtn" title="Discard every unsent judgment">Clear unsent</button>
  <button class="tbtn" id="capbtn" title="Capture a task from any tab">+ Capture</button>
  <button class="tbtn sendbtn" id="sendbtn">Send results<span class="n" id="sendn"></span></button>
</div>
<div class="quickcap" id="quickcap">
  <input type="text" id="quickbox" placeholder="Capture a task… Enter adds it to Send results" autocomplete="off">
  <span class="state" id="quickstate"></span>
</div>
<div class="notice" id="notice"></div>
<div class="export" id="exp">
  <textarea id="exptext" readonly></textarea>
  <div class="row"><button class="tbtn" id="copybtn">Copy to clipboard</button><span class="state" id="copystate"></span></div>
  <p class="expnote" id="expnote">Paste this into the chat and I'll record it, stamp Triaged on every row named, and write the delta.</p>
</div>
<div id="host"></div>
<p class="hint" id="hint"></p>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
